services:
  mysql:
    image: mysql:8.0
    container_name: owuf-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: owuf_root
      MYSQL_DATABASE: owuf
      MYSQL_USER: owuf
      MYSQL_PASSWORD: owuf_secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - owuf_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uowuf", "-powuf_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  owuf_mysql_data:
