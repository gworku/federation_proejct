services:
  - type: web
    name: owuf-web
    env: node
    region: oregon
    plan: free
    buildCommand: cd apps/web && npm ci && npm run build
    startCommand: cd apps/web && npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://owuf-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://owuf-api.onrender.com

  - type: web
    name: owuf-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    preDeployCommand: php artisan config:cache && php artisan route:cache && php artisan migrate --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://owuf-api.onrender.com
      - key: FRONTEND_URL
        value: https://owuf-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://owuf-web.onrender.com
      - key: LOG_CHANNEL
        value: daily
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: <YOUR_MYSQL_HOST>
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: <YOUR_DATABASE>
      - key: DB_USERNAME
        value: <YOUR_DB_USER>
      - key: DB_PASSWORD
        value: <YOUR_DB_PASSWORD>
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_COLLATION
        value: utf8mb4_unicode_ci
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca.pem
      - key: JWT_SECRET
        generateValue: true
